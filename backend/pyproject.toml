[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "UP",   # modern Python syntax
    "B",    # likely bugs / footguns
    "SIM",  # simplify code
    "C4",   # better comprehensions
    "FA",   # future annotations
    "RUF",  # Ruff-specific rules
]